name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Usa un token con permisos de solo lectura para mayor seguridad
          token: ${{ secrets.METRICS_TOKEN }} 
          user: ThomassEscobar
          template: classic
          
          base: ""
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          
          # 👇 La clave: no hagas commit en tu repo
          output_action: none
