name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ESTO ES VITAL
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ThomassEscobar
          template: classic
          
          base: ""
          
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 7 # Dejémoslo en 7 para forzar el cambio
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
